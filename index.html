<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yuniancong</title>
<meta name="description" content="yuniancong 的个人站点">
<style>
  :root {
    --bg: #fbfbfd;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.08);
    --card: rgba(255, 255, 255, 0.72);
    --accent: #0066cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --line: rgba(255, 255, 255, 0.1);
      --card: rgba(28, 28, 30, 0.72);
      --accent: #4da3ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text",
                 "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(0, 102, 204, 0.10), transparent 70%),
      radial-gradient(50% 40% at 100% 100%, rgba(120, 80, 255, 0.08), transparent 70%);
  }
  main {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: 40px 36px 32px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 24px; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #0066cc, #7b5cff);
    margin-bottom: 20px;
    user-select: none;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -0.01em;
    font-weight: 650;
  }
  .sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 15px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 26px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #30d158;
    box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.16);
  }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    flex: 1 1 auto;
    text-align: center;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 14px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  a.btn:hover { border-color: var(--accent); background: rgba(0, 102, 204, 0.06); transform: translateY(-1px); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn.primary:hover { opacity: 0.9; }
  footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <div class="avatar">Y</div>
  <h1>yuniancong</h1>
  <p class="sub">个人站点已上线 · GitHub Pages</p>

  <div class="status"><span class="dot"></span>站点运行正常</div>

  <div class="links">
    <a class="btn primary" href="https://github.com/yuniancong">GitHub 主页</a>
    <a class="btn" href="https://yuniancong.github.io">github.io</a>
  </div>

  <footer>
    <span>© <span id="y">2026</span> yuniancong</span>
    <span><code>yuniancong.loc.cc</code></span>
  </footer>
</main>
<script>
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
